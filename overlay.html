<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'self' ws://127.0.0.1:5173"
    />
    <title>Frameforge overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font:
          600 13px Consolas,
          "Cascadia Mono",
          monospace;
        color: #f5f5f7;
        user-select: none;
      }
      #box {
        box-sizing: border-box;
        height: 100%;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      #box.bottom {
        justify-content: flex-end;
      }
      #box.right {
        align-items: flex-end;
        text-align: right;
      }
      #panel {
        background: rgba(9, 10, 13, 0.82);
        border: 1px solid rgba(255, 85, 0, 0.6);
        border-top-width: 2px;
        border-radius: 0;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 150px;
      }
      #fps {
        font-size: 22px;
        line-height: 1;
        color: #ff5500;
      }
      #fps small {
        font-size: 11px;
        color: #a0a5b2;
      }
      #low {
        font-size: 12px;
        color: #a0a5b2;
      }
      #graph {
        width: 160px;
        height: 32px;
      }
      #sys {
        display: flex;
        gap: 10px;
        font-size: 12px;
      }
      #hint {
        font-size: 11px;
        color: #ffaa00;
      }
      #clock {
        font-size: 12px;
        color: #a0a5b2;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="box">
      <div id="panel">
        <div id="fps"></div>
        <div id="low"></div>
        <canvas id="graph" width="160" height="32"></canvas>
        <div id="sys"></div>
        <div id="hint"></div>
        <div id="clock"></div>
      </div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
