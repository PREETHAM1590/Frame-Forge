name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # Opt-in anonymous analytics; empty means the build ships with analytics disabled.
      APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run windows:test
      # package:win runs windows:publish, then build, then electron-builder (NSIS, unsigned).
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Stage unsigned installer
        shell: bash
        run: |
          mkdir -p unsigned
          cp release/Frameforge-Setup-*.exe unsigned/
          cp release/Frameforge-Setup-*.exe.blockmap unsigned/
      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: unsigned/*.exe
          if-no-files-found: error
      - name: Submit to SignPath
        id: signpath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Choose installer to publish
        shell: bash
        run: |
          mkdir -p publish
          if [ -d signed ] && ls signed/*.exe >/dev/null 2>&1; then
            # Signing changes the bytes, so the electron-builder blockmap no longer matches: publish none.
            cp signed/*.exe publish/; echo "Publishing SIGNED installer"
          else
            cp unsigned/*.exe unsigned/*.blockmap publish/; echo "Publishing UNSIGNED installer"
          fi
          # latest.yml (electron-updater) is always computed from the exact file being published.
          node tools/make-latest-yml.mjs publish/Frameforge-Setup-*.exe publish
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            publish/*.exe
            publish/*.blockmap
            publish/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist-release
      - name: Checksums and notes
        shell: bash
        run: |
          cd dist-release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0=="## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $ver"; exit 1; fi
          printf '\nCode signing: Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n\nPrivacy policy: [docs/PRIVACY.md](https://github.com/PREETHAM1590/Frame-Forge/blob/main/docs/PRIVACY.md)\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist-release/*.exe
            dist-release/*.blockmap
            dist-release/latest.yml
            dist-release/SHA256SUMS.txt
